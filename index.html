<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UFO Bắt Học Sinh - Game Gọi Tên Lớp Học</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Comfortaa, Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <!-- Confetti Canvas -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* Hiệu ứng ánh đèn vàng ấm từ các ô cửa sổ */
    @keyframes window-glow {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; filter: drop-shadow(0 0 12px rgba(254, 240, 138, 0.95)); }
    }
    .glow-window {
      animation: window-glow 4s ease-in-out infinite;
    }

    /* Vầng sáng đèn đường rọi xuống */
    .lamp-glow {
      background: radial-gradient(ellipse at 50% 0%, rgba(254, 240, 138, 0.4) 0%, rgba(254, 240, 138, 0.08) 55%, transparent 80%);
      pointer-events: none;
    }

    /* Chùm tia hút UFO dao động tần số */
    @keyframes beam-glow-pulse {
      0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 25px rgba(52, 211, 153, 0.75)); }
      50% { opacity: 1; filter: drop-shadow(0 0 50px rgba(110, 231, 183, 1)); }
    }
    .beam-active {
      animation: beam-glow-pulse 0.8s infinite alternate ease-in-out;
    }

    /* Hạt năng lượng bốc ngược lên đĩa bay */
    @keyframes energy-rise {
      0% { transform: translateY(100%) scale(0.6); opacity: 0; }
      40% { opacity: 0.9; }
      100% { transform: translateY(-30px) scale(1.4); opacity: 0; }
    }
    .energy-particle {
      position: absolute;
      border-radius: 9999px;
      background: #a7f3d0;
      box-shadow: 0 0 10px #34d399;
      animation: energy-rise 1.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }

    /* Tùy chỉnh thanh cuộn danh sách */
    textarea::-webkit-scrollbar, div::-webkit-scrollbar {
      width: 6px;
    }
    textarea::-webkit-scrollbar-thumb, div::-webkit-scrollbar-thumb {
      background-color: #475569;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-[#182334] h-screen w-screen overflow-hidden flex flex-col justify-between relative">

  <!-- ================= LỚP NỀN: THÀNH PHỐ ĐÊM CHÂN THỰC GIỐNG ẢNH ================= -->
  <div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
    <!-- Bầu trời đêm pastel -->
    <div class="absolute inset-0 bg-gradient-to-b from-[#131d2b] via-[#213245] to-[#344859]"></div>
    
    <!-- Các vì sao lấp lánh nhẹ -->
    <div id="stars-container" class="absolute inset-0"></div>

    <!-- Dãy nhà chung cư xa phía sau (Silhouette mờ) -->
    <div class="absolute bottom-44 left-0 right-0 h-96 flex items-end justify-between px-3 opacity-35">
      <div class="w-32 h-72 bg-[#121c27] rounded-t-lg mx-1"></div>
      <div class="w-40 h-84 bg-[#162230] rounded-t-xl mx-1"></div>
      <div class="w-28 h-64 bg-[#101923] rounded-t-lg mx-1"></div>
      <div class="w-48 h-92 bg-[#182635] rounded-t-2xl mx-1"></div>
      <div class="w-36 h-76 bg-[#131e2b] rounded-t-xl mx-1"></div>
      <div class="w-40 h-80 bg-[#172533] rounded-t-lg mx-1"></div>
    </div>

    <!-- Dãy nhà phố cận cảnh có cửa sổ phát sáng vàng ấm y hệt ảnh -->
    <div class="absolute bottom-28 left-0 right-0 h-80 flex items-end justify-between px-2">
      <!-- Nhà bên trái (2 ô cửa sổ lớn màu vàng) -->
      <div class="w-[30%] h-72 bg-[#3f4c58] rounded-t-2xl border-t-4 border-[#526372] relative p-4 shadow-2xl flex flex-wrap gap-4 content-start">
        <div class="w-14 h-16 bg-[#fef08a] rounded-sm glow-window shadow-[0_0_18px_rgba(254,240,138,0.85)] border border-amber-300">
          <div class="w-full h-1/2 border-b border-amber-500/40"></div>
          <div class="w-1/2 h-full border-r border-amber-500/40 -mt-8"></div>
        </div>
        <div class="w-14 h-16 bg-[#fde047] rounded-sm glow-window shadow-[0_0_18px_rgba(254,240,138,0.85)] border border-amber-300">
          <div class="w-full h-1/2 border-b border-amber-500/40"></div>
          <div class="w-1/2 h-full border-r border-amber-500/40 -mt-8"></div>
        </div>
        <div class="w-14 h-16 bg-[#2a343e] rounded-sm border border-slate-700"></div>
      </div>

      <!-- Nhà ở giữa: Biển hiệu phố mờ (như dòng chữ ĐÀO HUẾ trong hình) -->
      <div class="w-[38%] h-56 bg-[#354350] rounded-t-2xl border-t-4 border-[#485868] relative p-4 shadow-xl flex flex-col justify-between">
        <div class="flex gap-4">
          <div class="w-11 h-13 bg-[#fef08a] rounded-sm glow-window border border-amber-300"></div>
          <div class="w-11 h-13 bg-[#26313c] rounded-sm"></div>
          <div class="w-11 h-13 bg-[#fef08a] rounded-sm glow-window border border-amber-300"></div>
          <div class="w-11 h-13 bg-[#fef08a] rounded-sm glow-window border border-amber-300"></div>
        </div>
        <div class="text-[#69798e] text-xs sm:text-sm font-extrabold tracking-widest uppercase opacity-40 text-center">
          PHỐ ĐÊM HỌC TRÒ - 2026
        </div>
      </div>

      <!-- Nhà bên phải: Cửa sổ đôi sáng rực -->
      <div class="w-[29%] h-76 bg-[#394754] rounded-t-2xl border-t-4 border-[#4d5d6c] relative p-4 shadow-2xl flex flex-wrap gap-4 content-start">
        <div class="w-12 h-15 bg-[#fde047] rounded-sm glow-window shadow-[0_0_18px_rgba(254,240,138,0.85)] border border-amber-300"></div>
        <div class="w-12 h-15 bg-[#28323c] rounded-sm"></div>
        <div class="w-12 h-15 bg-[#fef08a] rounded-sm glow-window border border-amber-300"></div>
        <div class="w-12 h-15 bg-[#fef08a] rounded-sm glow-window border border-amber-300"></div>
      </div>
    </div>

    <!-- Mặt đường nhựa và vỉa hè người đi bộ -->
    <div class="absolute bottom-0 left-0 right-0 h-44 bg-gradient-to-b from-[#242b33] via-[#1b2229] to-[#12161b] border-t-4 border-[#3d4955]">
      <!-- Vỉa hè lát gạch cho người đi bộ -->
      <div class="w-full h-12 bg-[#2d3742] border-b-2 border-[#1c242c] opacity-90 flex">
        <div class="w-full h-full bg-[radial-gradient(#3a4654_1px,transparent_1px)] [background-size:16px_16px] opacity-40"></div>
      </div>
      <!-- Vạch kẻ lòng đường màu vàng phản quang -->
      <div class="w-full h-2 mt-12 flex justify-between px-8 opacity-40">
        <div class="w-24 h-2 bg-yellow-200 rounded"></div>
        <div class="w-24 h-2 bg-yellow-200 rounded"></div>
        <div class="w-24 h-2 bg-yellow-200 rounded"></div>
        <div class="w-24 h-2 bg-yellow-200 rounded"></div>
        <div class="w-24 h-2 bg-yellow-200 rounded"></div>
      </div>
    </div>

    <!-- CÁC CỘT ĐÈN ĐƯỜNG UỐN CONG CHUẨN THIẾT KẾ TRONG ẢNH -->
    <!-- Cột đèn trái -->
    <div class="absolute bottom-20 left-[15%] flex flex-col items-center pointer-events-none z-10">
      <div class="w-16 h-4 bg-amber-200 rounded-full shadow-[0_0_35px_#fde047] blur-[1px]"></div>
      <div class="w-56 h-88 lamp-glow -mt-2"></div>
      <svg class="absolute -top-3 w-16 h-88 overflow-visible" viewBox="0 0 60 260">
        <path d="M48,0 C20,0 8,16 8,46 L8,260" fill="none" stroke="#161f28" stroke-width="6.5" stroke-linecap="round"/>
        <ellipse cx="48" cy="4" rx="14" ry="4" fill="#0f171f"/>
        <ellipse cx="48" cy="5" rx="11" ry="3" fill="#fef08a"/>
      </svg>
    </div>

    <!-- Cột đèn phải -->
    <div class="absolute bottom-20 right-[18%] flex flex-col items-center pointer-events-none z-10">
      <div class="w-16 h-4 bg-amber-200 rounded-full shadow-[0_0_35px_#fde047] blur-[1px]"></div>
      <div class="w-56 h-88 lamp-glow -mt-2"></div>
      <svg class="absolute -top-3 w-16 h-88 overflow-visible transform scale-x-[-1]" viewBox="0 0 60 260">
        <path d="M48,0 C20,0 8,16 8,46 L8,260" fill="none" stroke="#161f28" stroke-width="6.5" stroke-linecap="round"/>
        <ellipse cx="48" cy="4" rx="14" ry="4" fill="#0f171f"/>
        <ellipse cx="48" cy="5" rx="11" ry="3" fill="#fef08a"/>
      </svg>
    </div>
  </div>

  <!-- ================= THANH THÔNG BÁO TRÊN ĐẦU (GIỐNG HỆT ẢNH) ================= -->
  <header class="relative z-40 pt-4 px-4 flex flex-col sm:flex-row items-center justify-between gap-3 max-w-5xl mx-auto w-full">
    <!-- Status Pill chuẩn từng nét -->
    <div class="bg-[#112721]/95 backdrop-blur-md border border-emerald-500/60 px-4 py-2.5 rounded-full shadow-2xl flex items-center gap-3 text-emerald-100 text-sm md:text-base font-bold transition-all">
      <span class="inline-block animate-spin text-emerald-400 text-lg">✦</span>
      <span id="status-marquee" class="tracking-wide text-emerald-200 min-w-[240px] sm:min-w-[320px]">
        Bám chặt nhé! UFO đang dò tín hiệu...
      </span>
      <div class="flex items-center gap-2 border-l border-emerald-500/40 pl-3">
        <span id="student-count-badge" class="bg-emerald-950/90 text-emerald-300 border border-emerald-400/40 px-3 py-0.5 rounded-full text-xs font-black shadow-inner">
          33 học sinh
        </span>
        <!-- Nút sửa danh sách -->
        <button id="btn-quick-edit" class="text-emerald-400 hover:text-white transition p-1 hover:scale-110 active:scale-95" title="Sửa danh sách học sinh">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
        </button>
      </div>
    </div>

    <!-- Thanh công cụ góc phải -->
    <div class="flex items-center gap-2.5 bg-[#1b2636]/90 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-slate-600/60 shadow-xl">
      <div class="flex items-center gap-1.5 text-xs text-slate-300 font-bold">
        <span>Bắt:</span>
        <select id="select-target-count" class="bg-[#0f172a] text-emerald-300 border border-emerald-500/50 rounded-lg px-2 py-1 font-bold text-xs focus:outline-none cursor-pointer">
          <option value="1">1 bạn</option>
          <option value="2">2 bạn</option>
          <option value="3" selected>3 bạn</option>
          <option value="4">4 bạn</option>
          <option value="5">5 bạn</option>
        </select>
      </div>

      <button id="btn-sound" class="p-1.5 text-slate-300 hover:text-emerald-300 rounded-full hover:bg-slate-700 transition" title="Âm thanh">
        <svg id="icon-sound-on" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
        <svg id="icon-sound-off" class="w-4 h-4 hidden text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z m12.414-4l4 4m0-4l-4 4"></path></svg>
      </button>

      <button id="btn-fullscreen" class="p-1.5 text-slate-300 hover:text-cyan-300 rounded-full hover:bg-slate-700 transition" title="Toàn màn hình">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-5h-4m4 0v4m0 0l-5-5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
      </button>
    </div>
  </header>

  <!-- ================= UFO & CHÙM TIA BẮT CÓC NĂNG LƯỢNG ================= -->
  <div class="relative w-full flex-1 pointer-events-none z-20 overflow-visible">
    <div id="ufo-vessel" class="absolute top-2 transition-transform duration-200 ease-out will-change-transform" style="left: 50%; transform: translateX(-50%);">
      <div class="relative flex flex-col items-center">
        
        <!-- BUỒNG LÁI TRONG SUỐT VỚI ALIEN CỬ ĐỘNG -->
        <div class="w-24 h-16 bg-gradient-to-t from-cyan-300/80 to-teal-100/90 rounded-t-full border-2 border-cyan-200 flex items-center justify-center relative overflow-hidden shadow-[0_0_25px_rgba(34,211,238,0.6)]">
          <div id="alien-pilot" class="flex items-center gap-2 mb-1.5 transition-transform duration-300">
            <div class="flex flex-col items-center">
              <div class="w-1.5 h-2 bg-emerald-400 rounded-full animate-bounce"></div>
              <div class="w-4 h-4 bg-emerald-500 rounded-full border border-emerald-700 flex items-center justify-center">
                <div class="w-1.5 h-1.5 bg-black rounded-full"></div>
              </div>
            </div>
            <div class="flex flex-col items-center">
              <div class="w-1.5 h-2 bg-emerald-400 rounded-full animate-bounce" style="animation-delay: 0.15s"></div>
              <div class="w-4 h-4 bg-emerald-500 rounded-full border border-emerald-700 flex items-center justify-center">
                <div class="w-1.5 h-1.5 bg-black rounded-full"></div>
              </div>
            </div>
          </div>
          <div class="absolute top-1 left-3 w-8 h-3.5 bg-white/70 rounded-full transform -rotate-12"></div>
        </div>

        <!-- THÂN ĐĨA BAY MÀU TRẮNG BẠC CHUẨN ẢNH -->
        <div class="w-88 sm:w-[410px] h-18 bg-gradient-to-b from-[#ffffff] via-[#e2e8f0] to-[#94a3b8] rounded-[100%] shadow-[0_12px_45px_rgba(0,0,0,0.7)] border-b-4 border-slate-400 flex items-center justify-between px-7 relative -mt-5">
          <div class="w-3 h-3 rounded-full bg-amber-400 shadow-[0_0_10px_#fbbf24] animate-ping"></div>
          <div class="w-3 h-3 rounded-full bg-cyan-400 shadow-[0_0_10px_#22d3ee] animate-pulse"></div>
          <div class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_10px_#34d399]"></div>

          <!-- BẢNG ĐIỆN TỬ LED '0/3' TRÊN THÂN UFO -->
          <div class="bg-[#052219] border-2 border-emerald-400 text-emerald-300 font-black text-xl px-5 py-0.5 rounded-lg shadow-[inset_0_2px_8px_rgba(0,0,0,0.8)] tracking-widest font-mono">
            <span id="ufo-counter">0/3</span>
          </div>

          <div class="w-3 h-3 rounded-full bg-rose-400 shadow-[0_0_10px_#f43f5e] animate-pulse"></div>
          <div class="w-3 h-3 rounded-full bg-cyan-400 shadow-[0_0_10px_#22d3ee] animate-ping"></div>
          <div class="w-3 h-3 rounded-full bg-amber-400 shadow-[0_0_10px_#fbbf24]"></div>
        </div>

        <!-- Đáy phát tia sáng -->
        <div class="w-40 h-7 bg-gradient-to-b from-slate-400 to-emerald-400/90 rounded-[100%] -mt-2.5 shadow-[0_0_25px_#34d399] border-t border-emerald-200"></div>

        <!-- TRACTOR BEAM CỰC KỲ RỰC RỠ -->
        <div id="tractor-beam-wrap" class="relative -mt-3.5 opacity-30 transition-opacity duration-500 overflow-visible flex justify-center">
          <svg class="w-[360px] sm:w-[480px] h-[580px] pointer-events-none overflow-visible" viewBox="0 0 400 650" preserveAspectRatio="none">
            <defs>
              <linearGradient id="ufoBeamGrad" x1="50%" y1="0%" x2="50%" y2="100%">
                <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.9" />
                <stop offset="20%" stop-color="#6ee7b7" stop-opacity="0.65" />
                <stop offset="65%" stop-color="#34d399" stop-opacity="0.35" />
                <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
              </linearGradient>
              <radialGradient id="ufoCoreGrad" cx="50%" cy="0%" r="90%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
                <stop offset="40%" stop-color="#6ee7b7" stop-opacity="0.55" />
                <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
              </radialGradient>
            </defs>
            <polygon points="160,0 240,0 395,640 5,640" fill="url(#ufoBeamGrad)" />
            <polygon points="180,0 220,0 320,640 80,640" fill="url(#ufoCoreGrad)" opacity="0.65" />
            <ellipse cx="200" cy="635" rx="192" ry="22" fill="#34d399" opacity="0.4" class="animate-pulse" />
          </svg>
          <div id="energy-particles-box" class="absolute inset-0 overflow-hidden pointer-events-none"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- ================= CANVAS KỸ THUẬT SỐ ĐIỀU KHIỂN CON NGƯỜI ĐI BỘ & BỊ HÚT ================= -->
  <div class="absolute inset-0 z-30 pointer-events-auto">
    <canvas id="game-canvas" class="w-full h-full block cursor-pointer"></canvas>
  </div>

  <!-- ================= NÚT BẮT ĐẦU QUÉT (DƯỚI GÓC NHƯ TRONG ẢNH) ================= -->
  <footer class="relative z-40 pb-5 px-6 flex justify-end items-center pointer-events-auto">
    <button id="btn-start-abduct" class="group relative flex items-center gap-2.5 px-6 py-3 bg-gradient-to-r from-emerald-500 via-teal-500 to-cyan-500 text-white font-black text-sm md:text-base rounded-full shadow-[0_8px_25px_rgba(16,185,129,0.5)] hover:shadow-[0_10px_35px_rgba(20,184,166,0.7)] hover:scale-105 active:scale-95 transition-all border-2 border-emerald-200">
      <span class="text-xl group-hover:rotate-45 transition-transform duration-300">🛸</span>
      <span id="btn-label" class="tracking-wider uppercase">Bắt Đầu Quét Học Sinh</span>
    </button>
  </footer>

  <!-- ================= MODAL: CHỈNH SỬA DANH SÁCH ================= -->
  <div id="modal-list" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-[#1e293b] border-2 border-slate-600 rounded-3xl max-w-lg w-full p-6 text-slate-100 shadow-2xl relative">
      <div class="flex justify-between items-center pb-3 border-b border-slate-700">
        <h3 class="text-xl font-extrabold text-emerald-400 flex items-center gap-2">
          <span>📝</span> Danh Sách Học Sinh Đi Bộ
        </h3>
        <button id="btn-close-modal" class="text-slate-400 hover:text-white p-1 rounded-full text-xl leading-none">✕</button>
      </div>

      <div class="mt-4">
        <label class="block text-xs text-slate-300 font-semibold mb-1">
          Dán danh sách học sinh (mỗi bạn 1 dòng):
        </label>
        <textarea id="textarea-names" rows="9" class="w-full bg-[#0f172a] border border-slate-700 rounded-xl p-3 text-sm text-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 font-mono"></textarea>
      </div>

      <div class="flex items-center justify-between mt-3 text-xs">
        <span id="modal-count-info" class="text-slate-400">Đang có: 33 bạn</span>
        <button id="btn-reset-default" class="text-cyan-400 hover:underline">Khôi phục danh sách mẫu</button>
      </div>

      <div class="flex gap-3 mt-5">
        <button id="btn-save-list" class="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold rounded-xl shadow-lg transition active:scale-95">
          Lưu & Tải Lại Lớp
        </button>
        <button id="btn-cancel-list" class="px-5 py-3 bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold rounded-xl transition">
          Hủy
        </button>
      </div>
    </div>
  </div>

  <!-- ================= MODAL: KẾT QUẢ VINH DANH ================= -->
  <div id="modal-result" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="bg-gradient-to-b from-[#1b2f28] to-[#0f1d19] border-2 border-emerald-400 rounded-3xl max-w-md w-full p-6 text-center text-slate-100 shadow-[0_0_50px_rgba(52,211,153,0.35)] relative transform transition scale-95 duration-300">
      
      <div class="w-20 h-20 mx-auto -mt-14 bg-emerald-500 rounded-full border-4 border-[#1b2f28] shadow-lg flex items-center justify-center text-4xl animate-bounce">
        🛸
      </div>

      <h2 class="text-2xl font-black text-emerald-300 mt-2 uppercase tracking-wide">

    /* STATE MANAGEMENT */
    let studentNames = [];

    /* ================= SOUND ENGINE (WEB AUDIO API) ================= */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function getAudioCtx() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playScanAudio() {
      if (!soundEnabled) return;
      try {
        const c = getAudioCtx();
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, c.currentTime + 0.25);
        gain.gain.setValueAtTime(0.08, c.currentTime);
        gain.gain.linearRampToValueAtTime(0.001, c.currentTime + 0.25);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 0.26);
      } catch(e) {}
    }

    function playBeamAbductAudio() {
      if (!soundEnabled) return;
      try {
        const c = getAudioCtx();
        // Âm thanh vòm xoáy không gian rít lên
        const osc = c.createOscillator();
        const gain = c.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, c.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1100, c.currentTime + 2.2);
        gain.gain.setValueAtTime(0.12, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, c.currentTime + 2.2);
        osc.connect(gain);
        gain.connect(c.destination);
        osc.start();
        osc.stop(c.currentTime + 2.25);
      } catch(e) {}
    }

    function playVictoryAudio() {
      if (!soundEnabled) return;
      try {
        const c = getAudioCtx();
        const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51];
        freqs.forEach((f, i) => {
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = 'triangle';
          osc.frequency.value = f;
          g.gain.setValueAtTime(0.12, c.currentTime + i * 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + i * 0.1 + 0.35);
          osc.connect(g);
          g.connect(c.destination);
          osc.start(c.currentTime + i * 0.1);
          osc.stop(c.currentTime + i * 0.1 + 0.36);
        });
      } catch(e) {}
    }

    /* ================= LỚP ĐỐI TƯỢNG HỌC SINH ĐI BỘ & BỊ HÚT ================= */
    class HumanStudent {
      constructor(name, index, total) {
        this.name = name;
        this.index = index;
        
        // Kích thước chuẩn con người
        this.height = 70; // Chiều cao cơ thể (pixels)
        this.scale = 0.95 + Math.random() * 0.15; // Chiều cao ngẫu nhiên tự nhiên
        
        // Tọa độ
        this.x = (window.innerWidth / (total + 1)) * (index + 1) + (Math.random() * 60 - 30);
        this.groundY = window.innerHeight - 85 - (index % 3) * 10; // Phân tầng đứng trên vỉa hè/đường
        this.y = this.groundY;
        this.vy = 0;
        
        // Hướng và bước đi
        this.direction = Math.random() > 0.5 ? 1 : -1;
        this.walkSpeed = 0.7 + Math.random() * 0.8;
        this.walkCycle = Math.random() * Math.PI * 2;
        this.isIdle = false;
        this.idleTimer = 0;

        // Trạng thái bị UFO bắt cóc
        this.state = 'WALKING'; // WALKING, TARGETED, ABDUCTING, ABDUCTED
        this.abductProgress = 0; // 0 -> 1
        this.panicPhase = Math.random() * 10;
        this.rotation = 0;

        // Lời thoại bong bóng & tự động đổi câu thoại khi đi dạo
        this.shoutText = CASUAL_SHOUTS[Math.floor(Math.random() * CASUAL_SHOUTS.length)];
        this.shoutTimer = 2500 + Math.random() * 3000; // Thời gian hiển thị
        this.nextChatCooldown = 1500 + Math.random() * 3000; // Thời gian nghỉ giữa các câu
        this.isPanicking = false;

        // Màu sắc trang phục riêng biệt
        this.gender = index % 2 === 0 ? 'male' : 'female';
        this.shirtColor = SHIRT_COLORS[index % SHIRT_COLORS.length];
        this.pantsColor = PANTS_COLORS[index % PANTS_COLORS.length];
        this.backpackColor = BACKPACK_COLORS[index % BACKPACK_COLORS.length];
        this.hairColor = HAIR_COLORS[index % HAIR_COLORS.length];
        this.skinColor = SKIN_COLORS[index % SKIN_COLORS.length];
      }

      setShout(text, duration = 3000, isPanic = false) {
        this.shoutText = text;
        this.shoutTimer = duration;
        this.isPanicking = isPanic;
      }

      update(dt) {
        // Cập nhật hệ thống bong bóng thoại liên tục cho học sinh
        if (this.shoutTimer > 0) {
          this.shoutTimer -= dt;
          if (this.shoutTimer <= 0) {
            this.shoutText = null;
            // Thiết lập thời gian nghỉ trước khi nói câu kế tiếp
            this.nextChatCooldown = 1800 + Math.random() * 3500;
          }
        } else if (this.state === 'WALKING') {
          // Khi đang đi bộ bình thường, đếm ngược để tự động phát biểu câu ngẫu nhiên mới
          this.nextChatCooldown -= dt;
          if (this.nextChatCooldown <= 0) {
            const nextQuote = CASUAL_SHOUTS[Math.floor(Math.random() * CASUAL_SHOUTS.length)];
            this.setShout(nextQuote, 3000 + Math.random() * 2500, false);
          }
        }

        if (this.state === 'WALKING') {
          // Thỉnh thoảng dừng lại ngó nghiêng rồi đi tiếp
          this.idleTimer -= dt;
          if (this.idleTimer <= 0) {
            if (this.isIdle) {
              this.isIdle = false;
              this.idleTimer = 3000 + Math.random() * 5000;
              if (Math.random() < 0.3) this.direction *= -1; // Đôi khi quay đầu
            } else {
              if (Math.random() < 0.2) {
                this.isIdle = true;
                this.idleTimer = 1500 + Math.random() * 2500;
              }
            }
          }

          if (!this.isIdle) {
            this.x += this.walkSpeed * this.direction;
            this.walkCycle += 0.1 * this.walkSpeed;
          }

          // Quay đầu khi đi tới mép màn hình
          const padding = 40;
          if (this.x > window.innerWidth - padding) {
            this.x = window.innerWidth - padding;
            this.direction = -1;
          } else if (this.x < padding) {
            this.x = padding;
            this.direction = 1;
          }

        } else if (this.state === 'TARGETED') {
          // UFO đã định vị: giật mình dừng bước, ngửa đầu nhìn lên
          this.isIdle = true;
          this.panicPhase += 0.2;

        } else if (this.state === 'ABDUCTING') {
          // Đang bị chùm tia hút bốc lên không trung
          this.panicPhase += 0.35; // Quẫy đạp liên tục
          this.abductProgress += dt / 2200; // Thời gian hút lên khoảng 2.2 giây

          // Quỹ đạo bay lên đĩa bay
          const targetY = 160; // Ngay dưới đáy UFO
          const currentProgress = Math.min(this.abductProgress, 1);
          
          // Chuyển động gia tốc nhẹ lên trên
          const easeProgress = Math.pow(currentProgress, 1.8);
          this.y = this.groundY - (this.groundY - targetY) * easeProgress;
          
          // Đung đưa lơ lửng trong chùm tia và xoay nhẹ người
          this.rotation = Math.sin(this.panicPhase * 0.8) * 0.25;

          if (this.abductProgress >= 1) {
            this.state = 'ABDUCTED';
          }
        }
      }

      draw(c) {
        if (this.state === 'ABDUCTED') return;

        c.save();
        c.translate(this.x, this.y);

        // Hiệu ứng bóng đổ trên mặt đất khi đang đi bộ
        if (this.state === 'WALKING' || this.state === 'TARGETED') {
          c.beginPath();
          c.ellipse(0, 0, 16 * this.scale, 5 * this.scale, 0, 0, Math.PI * 2);
          c.fillStyle = 'rgba(0, 0, 0, 0.4)';
          c.fill();
        } else if (this.state === 'ABDUCTING') {
          // Khi bay lên cao, bóng mờ dần và nhỏ lại dưới đất
          const heightAboveGround = this.groundY - this.y;
          const shadowScale = Math.max(0.2, 1 - heightAboveGround / 400);
          c.save();
          c.translate(0, heightAboveGround);
          c.beginPath();
          c.ellipse(0, 0, 16 * this.scale * shadowScale, 5 * this.scale * shadowScale, 0, 0, Math.PI * 2);
          c.fillStyle = `rgba(0, 0, 0, ${0.4 * shadowScale})`;
          c.fill();
          c.restore();
        }

        // Lật mặt theo hướng đi (hoặc xoay nghiêng khi bị hút)
        c.scale(this.direction * this.scale, this.scale);
        c.rotate(this.rotation);

        // VẼ HÌNH DÁNG CON NGƯỜI VỚI KHỚP XƯƠNG HOẠT HỌA CHÂN THỰC
        this.renderHumanBody(c);

        c.restore();

        // VẼ BONG BÓNG TÊN & LỜI THOẠI TRÊN ĐẦU
        this.renderNameAndBubble(c);
      }

      // HỆ THỐNG KHỚP NỐI & ANIMATION BƯỚC ĐI HOẶC QUẪY ĐẠP
      renderHumanBody(c) {
        const h = this.height; // ~70px
        let hipY = -28;
        let headY = -56;
        let chestY = -42;

        let leftLegAngle = 0;
        let rightLegAngle = 0;
        let leftKneeAngle = 0;
        let rightKneeAngle = 0;

        let leftArmAngle = 0;
        let rightArmAngle = 0;
        let headBob = 0;

        if (this.state === 'WALKING') {
          if (!this.isIdle) {
            // Bước chân đi bộ tự nhiên (Sine Wave Kinematics)
            const cycle = this.walkCycle;
            leftLegAngle = Math.sin(cycle) * 0.65;
            rightLegAngle = Math.sin(cycle + Math.PI) * 0.65;
            
            // Đầu gối co duỗi tự nhiên khi nhấc chân
            leftKneeAngle = Math.max(0, -Math.sin(cycle) * 0.8);
            rightKneeAngle = Math.max(0, -Math.sin(cycle + Math.PI) * 0.8);

            // Đung đưa hai cánh tay ngược hướng chân
            leftArmAngle = -Math.sin(cycle) * 0.55;
            rightArmAngle = -Math.sin(cycle + Math.PI) * 0.55;

            // Nhấp nhô cơ thể khi đi bộ
            headBob = Math.abs(Math.sin(cycle * 2)) * 2.5;
          }
        } else if (this.state === 'TARGETED') {
          // Bất ngờ giật mình: ngửa nhẹ đầu ra sau nhìn bầu trời
          headBob = -2;
          leftArmAngle = -0.3;
          rightArmAngle = 0.3;
        } else if (this.state === 'ABDUCTING') {
          // HIỆU ỨNG QUẪY ĐẠP HỐT HOẢNG CHÂN THỰC TRONG KHÔNG TRUNG (Flailing Limbs)
          const p = this.panicPhase;
          leftLegAngle = Math.sin(p * 2.4) * 0.85;
          rightLegAngle = Math.cos(p * 2.1) * 0.85;
          leftKneeAngle = Math.abs(Math.sin(p * 2.8)) * 1.2;
          rightKneeAngle = Math.abs(Math.cos(p * 2.5)) * 1.2;

          // Hai tay giơ cao vung vẩy hốt hoảng kêu cứu
          leftArmAngle = -2.2 + Math.sin(p * 3.2) * 0.6;
          rightArmAngle = -2.4 + Math.cos(p * 3.5) * 0.6;

          headBob = Math.sin(p * 4) * 2;
        }

        // ================= VẼ BÊN XA (TAY TRÁI & CHÂN TRÁI) =================
        // Chân sau
        this.drawLeg(c, hipY + headBob, leftLegAngle, leftKneeAngle, this.pantsColor, true);
        // Cánh tay sau
        this.drawArm(c, chestY + headBob, leftArmAngle, this.shirtColor, true);

        // ================= THÂN NGƯỜI (ÁO ĐỒNG PHỤC & BALO) =================
        // Balo học sinh đeo sau lưng
        c.fillStyle = this.backpackColor;
        c.beginPath();
        c.roundRect(-14, chestY - 10 + headBob, 9, 20, 4);
        c.fill();
        c.strokeStyle = '#0f172a';
        c.lineWidth = 1;
        c.stroke();

        // Thân áo sơ mi trắng đồng phục
        c.fillStyle = this.shirtColor;
        c.beginPath();
        c.roundRect(-8, chestY - 12 + headBob, 16, 26, 4);
        c.fill();
        c.strokeStyle = '#cbd5e1';
        c.lineWidth = 1.2;
        c.stroke();

        // Khăn quàng đỏ học sinh Việt Nam
        c.fillStyle = '#dc2626';
        c.beginPath();
        c.moveTo(-2, chestY - 10 + headBob);
        c.lineTo(4, chestY - 10 + headBob);
        c.lineTo(1, chestY + 2 + headBob);
        c.closePath();
        c.fill();

        // ================= ĐẦU, MẶT & MÁI TÓC =================
        const curHeadY = headY + headBob;
        
        // Cổ
        c.fillStyle = this.skinColor;
        c.fillRect(-2.5, curHeadY + 9, 5, 5);

        // Khuôn mặt
        c.beginPath();
        c.arc(0, curHeadY, 8.5, 0, Math.PI * 2);
        c.fillStyle = this.skinColor;
        c.fill();

        // Mắt & Miệng biểu cảm
        if (this.state === 'ABDUCTING') {
          // Mắt chữ O hoảng hốt
          c.fillStyle = '#0f172a';
          c.beginPath();
          c.arc(2.5, curHeadY - 1, 1.8, 0, Math.PI * 2);
          c.fill();
          // Miệng há to la hét
          c.beginPath();
          c.arc(3.5, curHeadY + 4, 2.5, 0, Math.PI * 2);
          c.fillStyle = '#991b1b';
          c.fill();
        } else {
          // Mắt nhìn vui vẻ
          c.fillStyle = '#0f172a';
          c.beginPath();
          c.arc(3, curHeadY - 0.5, 1.4, 0, Math.PI * 2);
          c.fill();
          // Cười mỉm
          c.strokeStyle = '#78350f';
          c.lineWidth = 1;
          c.beginPath();
          c.arc(2.5, curHeadY + 2.5, 2, 0.1, Math.PI * 0.9);
          c.stroke();
        }

        // Mái tóc
        c.fillStyle = this.hairColor;
        c.beginPath();
        if (this.gender === 'female') {
          // Tóc đuôi ngựa buộc sau hoặc xõa ngang vai
          c.arc(0, curHeadY - 2, 9.5, Math.PI * 0.8, Math.PI * 2.2);
          c.lineTo(-9, curHeadY + 8);
          c.lineTo(-12, curHeadY + 5);
          c.fill();
          // Nơ tóc
          c.fillStyle = '#ec4899';
          c.beginPath();
          c.arc(-8, curHeadY + 4, 2.5, 0, Math.PI * 2);
          c.fill();
        } else {
          // Tóc undercut gọn gàng nam sinh
          c.arc(0, curHeadY - 2, 9.5, Math.PI * 0.7, Math.PI * 2.1);
          c.lineTo(5, curHeadY - 2);
          c.fill();
        }

        // ================= VẼ BÊN GẦN (TAY PHẢI & CHÂN PHẢI) =================
        // Chân trước
        this.drawLeg(c, hipY + headBob, rightLegAngle, rightKneeAngle, this.pantsColor, false);
        // Cánh tay trước
        this.drawArm(c, chestY + headBob, rightArmAngle, this.shirtColor, false);
      }

      drawLeg(c, hipY, hipAngle, kneeAngle, color, isBack) {
        c.save();
        c.translate(isBack ? -2 : 2, hipY);
        c.rotate(hipAngle);

        // Đùi (Upper leg)
        c.strokeStyle = isBack ? '#172554' : color;
        c.lineWidth = 4.5;
        c.lineCap = 'round';
        c.beginPath();
        c.moveTo(0, 0);
        c.lineTo(0, 14);
        c.stroke();

        // Đầu gối & Bắp chân (Lower leg)
        c.translate(0, 14);
        c.rotate(kneeAngle);
        c.beginPath();
        c.moveTo(0, 0);
        c.lineTo(0, 14);
        c.stroke();

        // Bàn chân mang giày Sneaker đi học
        c.fillStyle = isBack ? '#64748b' : '#ffffff';
        c.beginPath();
        c.ellipse(2, 14, 5, 2.5, 0, 0, Math.PI * 2);
        c.fill();
        c.strokeStyle = '#0f172a';
        c.lineWidth = 1;
        c.stroke();

        c.restore();
      }

      drawArm(c, shoulderY, armAngle, color, isBack) {
        c.save();
        c.translate(isBack ? -4 : 4, shoulderY);
        c.rotate(armAngle);

        // Cánh tay
        c.strokeStyle = color;
        c.lineWidth = 3.5;
        c.lineCap = 'round';
        c.beginPath();
        c.moveTo(0, 0);
        c.lineTo(0, 13);
        c.stroke();

        // Cẳng tay & Bàn tay
        c.translate(0, 13);
        c.strokeStyle = this.skinColor;
        c.beginPath();
        c.moveTo(0, 0);
        c.lineTo(0, 8);
        c.stroke();
        c.beginPath();
        c.arc(0, 8, 2.5, 0, Math.PI * 2);
        c.fillStyle = this.skinColor;
        c.fill();

        c.restore();
      }

      // VẼ BONG BÓNG TÊN CHUẨN TỪNG CHỮ NHƯ TRONG ẢNH
      renderNameAndBubble(c) {
        c.save();
        const curHeadY = this.y - 75 * this.scale;

        // BONG BÓNG TÊN HỌC SINH (VIẾT HOA TRẮNG NỔI BẬT NHƯ ẢNH)
        c.font = '900 11px Nunito, sans-serif';
        const nameWidth = c.measureText(this.name).width;
        const boxW = nameWidth + 18;
        const boxH = 22;
        const boxX = this.x - boxW / 2;
        const boxY = curHeadY - 14;

        // Đổ bóng bong bóng tên
        c.shadowColor = 'rgba(0, 0, 0, 0.45)';
        c.shadowBlur = 8;
        c.shadowOffsetY = 3;

        c.fillStyle = '#ffffff';
        c.strokeStyle = '#cbd5e1';
        c.lineWidth = 1.5;
        c.beginPath();
        c.roundRect(boxX, boxY, boxW, boxH, 11);
        c.fill();
        c.stroke();

        // Reset bóng đổ để text sắc nét
        c.shadowColor = 'transparent';

        // Chữ tên học sinh
        c.fillStyle = '#0f172a';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillText(this.name, this.x, boxY + boxH / 2 + 0.5);

        // BONG BÓNG LỜI THOẠI TRÊN ĐẦU (NẰM PHÍA TRÊN BẢNG TÊN)
        if (this.shoutText) {
          c.font = this.isPanicking ? '900 11.5px Nunito, sans-serif' : 'bold 11px Nunito, sans-serif';
          const textWidth = c.measureText(this.shoutText).width;
          const bubbleWidth = Math.max(textWidth + 18, 50);
          const bubbleHeight = 24;

          const bx = this.x - bubbleWidth / 2;
          const by = boxY - bubbleHeight - 8;

          // Hiệu ứng màu: Vàng pastel nhẹ nhàng khi đi bộ, Đỏ rực báo động khi bị bắt
          if (this.isPanicking) {
            c.fillStyle = '#ef4444';
            c.strokeStyle = '#fecaca';
            c.shadowColor = 'rgba(239, 68, 68, 0.6)';
            c.shadowBlur = 10;
          } else {
            c.fillStyle = '#fef9c3'; // Vàng pastel ấm áp
            c.strokeStyle = '#facc15';
            c.shadowColor = 'rgba(0, 0, 0, 0.3)';
            c.shadowBlur = 6;
            c.shadowOffsetY = 2;
          }
          c.lineWidth = 1.4;

          // Khung bong bóng bo tròn
          c.beginPath();
          c.roundRect(bx, by, bubbleWidth, bubbleHeight, 10);
          c.fill();
          c.stroke();

          // Mũi nhọn bong bóng trỏ xuống bảng tên
          c.beginPath();
          c.moveTo(this.x - 3.5, by + bubbleHeight);
          c.lineTo(this.x + 3.5, by + bubbleHeight);
          c.lineTo(this.x, by + bubbleHeight + 4.5);
          c.closePath();
          c.fill();
          c.stroke();

          c.shadowColor = 'transparent';

          // Chữ trong bong bóng thoại
          c.fillStyle = this.isPanicking ? '#ffffff' : '#713f12';
          c.textAlign = 'center';
          c.textBaseline = 'middle';
          c.fillText(this.shoutText, this.x, by + bubbleHeight / 2);
        }

        c.restore();
      }
    }

    /* ================= KHỞI TẠO DỮ LIỆU & GIAO DIỆN ================= */
    function initData() {
      const saved = localStorage.getItem('ufo_walker_names_v1');
      if (saved) {
        try {
          studentNames = JSON.parse(saved);
        } catch (e) {
          studentNames = [...DEFAULT_STUDENTS];
        }
      } else {
        studentNames = [...DEFAULT_STUDENTS];
      }

      targetCount = parseInt(selectTargetCount.value, 10);
      updateBadge();
      createStars();
      createEnergyParticles();
      resizeCanvas();
      spawnStudents();
      startMainLoop();
    }

    function saveToStorage() {
      localStorage.setItem('ufo_walker_names_v1', JSON.stringify(studentNames));
      updateBadge();
    }

    function updateBadge() {
      studentCountBadge.textContent = `${studentNames.length} học sinh`;
      ufoCounter.textContent = `${currentAbductedCount}/${targetCount}`;
    }

    function createStars() {
      const box = document.getElementById('stars-container');
      box.innerHTML = '';
      for (let i = 0; i < 48; i++) {
        const star = document.createElement('div');
        star.className = 'absolute rounded-full bg-white opacity-70 animate-pulse';
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 55}%`;
        const size = Math.random() * 2.5 + 1;
        star.style.width = `${size}px`;
        star.style.height = `${size}px`;
        star.style.animationDelay = `${Math.random() * 3}s`;
        box.appendChild(star);
      }
    }

    function createEnergyParticles() {
      energyParticlesBox.innerHTML = '';
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'energy-particle';
        const size = Math.random() * 6 + 4;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.left = `${30 + Math.random() * 40}%`;
        p.style.bottom = `${Math.random() * 20}%`;
        p.style.animationDelay = `${Math.random() * 2}s`;
        p.style.animationDuration = `${1.2 + Math.random() * 0.8}s`;
        energyParticlesBox.appendChild(p);
      }
    }

    function spawnStudents() {
      students = [];
      studentNames.forEach((name, i) => {
        students.push(new HumanStudent(name, i, studentNames.length));
      });
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (!isAbducting) {
        ufoX = window.innerWidth / 2;
        ufoTargetX = window.innerWidth / 2;
      }
    }

    /* ================= MAIN GAME LOOP ================= */
    let lastTimestamp = performance.now();
    let casualShoutTimer = 0;

    function startMainLoop() {
      function tick(now) {
        const dt = now - lastTimestamp;
        lastTimestamp = now;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. UFO DI CHUYỂN TUẦN TRA HOẶC BÁM ĐUỔI
        const screenW = window.innerWidth;
        if (!isAbducting) {
          ufoX += ufoPatrolSpeed * ufoDirection;
          if (ufoX > screenW - 170) {
            ufoDirection = -1;
            alienPilot.style.transform = 'scaleX(-1)';
          } else if (ufoX < 170) {
            ufoDirection = 1;
            alienPilot.style.transform = 'scaleX(1)';
          }
          const bobbingY = Math.sin(now * 0.003) * 6;
          ufoVessel.style.left = `${ufoX}px`;
          ufoVessel.style.transform = `translateX(-50%) translateY(${bobbingY}px)`;
        } else {
          // Bám theo học sinh mục tiêu
          ufoX += (ufoTargetX - ufoX) * 0.08;
          ufoVessel.style.left = `${ufoX}px`;
          ufoVessel.style.transform = `translateX(-50%) translateY(0px)`;
        }

        // 2. CẬP NHẬT & VẼ TẤT CẢ CON NGƯỜI ĐI BỘ TRÊN PHỐ
        // Sắp xếp theo chiều sâu Y để bạn đứng trước vẽ đè lên bạn đứng sau
        students.sort((a, b) => a.groundY - b.groundY);

        students.forEach(st => {
          st.update(dt);
          st.draw(ctx);
        });

        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    /* ================= CLICK CHỌC HỌC SINH NÓI CHUYỆN ================= */
    canvas.addEventListener('click', (e) => {
      if (isAbducting) return;
      const rect = canvas.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;

      for (let i = students.length - 1; i >= 0; i--) {
        const s = students[i];
        if (s.state === 'WALKING') {
          const dx = Math.abs(clickX - s.x);
          const dy = clickY - s.y;
          if (dx < 35 && dy > -80 && dy < 15) {
            const randomPanic = PANIC_SHOUTS[Math.floor(Math.random() * PANIC_SHOUTS.length)];
            s.setShout(randomPanic, 2800, true);
            playScanAudio();
            break;
          }
        }
      }
    });

    /* ================= QUY TRÌNH UFO HÚT NGƯỜI LÊN KHÔNG TRUNG ================= */
    async function startAbductionProcess() {
      if (isAbducting) return;
      if (studentNames.length === 0) {
        setStatus("Danh sách đang trống! Bấm nút bút chì để thêm học sinh nhé.");
        return;
      }

      isAbducting = true;
      btnStart.disabled = true;
      btnStart.classList.add('opacity-50', 'cursor-not-allowed');
      btnLabel.textContent = "UFO ĐANG DÒ...";

      currentAbductedCount = 0;
      abductedList = [];
      ufoCounter.textContent = `0/${targetCount}`;

      const activeCandidates = students.filter(s => s.state === 'WALKING');
      const countToPick = Math.min(targetCount, activeCandidates.length);

      // Xáo trộn ngẫu nhiên chọn người bị bắt
      const shuffled = [...activeCandidates].sort(() => 0.5 - Math.random());
      const chosenStudents = shuffled.slice(0, countToPick);

      for (let i = 0; i < chosenStudents.length; i++) {
        const target = chosenStudents[i];
        target.state = 'TARGETED';

        setStatus(`✦ Đang khóa tọa độ: ${target.name}!`);

        // UFO bay đến ngay trên đỉnh đầu học sinh
        for (let step = 0; step < 28; step++) {
          ufoTargetX = target.x;
          playScanAudio();
          await waitTime(50);
        }

        await waitTime(350);

        // KÍCH HOẠT CHÙM TIA NĂNG LƯỢNG RỰC RỠ
        setStatus(`✦ Chùm tia hạ xuống! Đang hút ${target.name} lên đĩa bay...`);
        tractorBeamWrap.classList.add('beam-active');
        tractorBeamWrap.style.opacity = '1';
        playBeamAbductAudio();

        // Bạn học sinh hét toáng lên hốt hoảng
        const panicVoice = PANIC_SHOUTS[Math.floor(Math.random() * PANIC_SHOUTS.length)];
        target.setShout(panicVoice, 3000, true);

        // BẮT ĐẦU CHUYỂN ĐỘNG BỊ NHẤC BỔNG VÀ QUẪY ĐẠP TRONG KHÔNG TRUNG
        target.state = 'ABDUCTING';

        // Chờ quá trình hút hoàn thành (2.2 giây)
        await waitTime(2200);

        currentAbductedCount++;
        ufoCounter.textContent = `${currentAbductedCount}/${targetCount}`;
        abductedList.push(target.name);

        await waitTime(350);

        // Tạm giảm độ sáng tia trước khi bay sang bạn kế tiếp
        tractorBeamWrap.classList.remove('beam-active');
        tractorBeamWrap.style.opacity = '0.3';
      }

      // HOÀN THÀNH TOÀN BỘ LƯỢT BẮT
      setStatus("✦ Đã đón thành công các bạn lên đĩa bay!");
      playVictoryAudio();

      confetti({
        particleCount: 120,
        spread: 85,
        origin: { y: 0.3 }
      });

      await waitTime(700);
      showResultModal();

      btnStart.disabled = false;
      btnStart.classList.remove('opacity-50', 'cursor-not-allowed');
      btnLabel.textContent = "Bắt Đầu Quét Học Sinh";
      isAbducting = false;
    }

    function setStatus(msg) {
      statusMarquee.textContent = msg;
    }

    function waitTime(ms) {
      return new Promise(r => setTimeout(r, ms));
    }

    /* ================= KẾT QUẢ & CÔNG BỐ ================= */
    function showResultModal() {
      resultStudentsContainer.innerHTML = '';
      abductedList.forEach((name, i) => {
        const item = document.createElement('div');
        item.className = 'flex items-center justify-between bg-emerald-950/70 border border-emerald-500/40 rounded-xl px-4 py-2.5 shadow';
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-6 h-6 rounded-full bg-emerald-400 text-slate-900 font-black text-xs flex items-center justify-center">${i + 1}</span>
            <span class="font-extrabold text-base text-emerald-100">${name}</span>
          </div>
          <span class="text-xl">🌟</span>
        `;
        resultStudentsContainer.appendChild(item);
      });
      modalResult.classList.remove('hidden');
    }

    btnFinishRound.addEventListener('click', () => {
      modalResult.classList.add('hidden');
      spawnStudents();
      currentAbductedCount = 0;
      ufoCounter.textContent = `0/${targetCount}`;
      setStatus("✦ Bám chặt nhé! UFO đang dò tín hiệu...");
    });

    btnRemovePicked.addEventListener('click', () => {
      studentNames = studentNames.filter(n => !abductedList.includes(n));
      saveToStorage();
      modalResult.classList.add('hidden');
      spawnStudents();
      currentAbductedCount = 0;
      ufoCounter.textContent = `0/${targetCount}`;
      setStatus(`✦ Đã loại ${abductedList.length} bạn đã gọi. Lớp còn lại ${studentNames.length} bạn.`);
    });

    /* ================= QUẢN LÝ DANH SÁCH LỚP HỌC ================= */
    btnQuickEdit.addEventListener('click', () => {
      textareaNames.value = studentNames.join('\n');
      modalCountInfo.textContent = `Đang có: ${studentNames.length} bạn`;
      modalList.classList.remove('hidden');
    });

    textareaNames.addEventListener('input', () => {
      const list = textareaNames.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
      modalCountInfo.textContent = `Đang có: ${list.length} bạn`;
    });

    btnCloseModal.addEventListener('click', () => modalList.classList.add('hidden'));
    btnCancelList.addEventListener('click', () => modalList.classList.add('hidden'));

    btnSaveList.addEventListener('click', () => {
      const list = textareaNames.value.split('\n').map(s => s.trim()).filter(s => s.length > 0);
      if (list.length === 0) {
        setStatus("Danh sách không được để trống!");
        return;
      }
      studentNames = list;
      saveToStorage();
      modalList.classList.add('hidden');
      spawnStudents();
      setStatus(`✦ Đã cập nhật danh sách (${studentNames.length} học sinh)!`);
    });

    btnResetDefault.addEventListener('click', () => {
      textareaNames.value = DEFAULT_STUDENTS.join('\n');
      modalCountInfo.textContent = `Đang có: ${DEFAULT_STUDENTS.length} bạn`;
    });

    selectTargetCount.addEventListener('change', (e) => {
      targetCount = parseInt(e.target.value, 10);
      ufoCounter.textContent = `0/${targetCount}`;
    });

    /* ================= CÁC TIỆN ÍCH KHÁC ================= */
    btnSound.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) {
        iconSoundOn.classList.remove('hidden');
        iconSoundOff.classList.add('hidden');
      } else {
        iconSoundOn.classList.add('hidden');
        iconSoundOff.classList.remove('hidden');
      }
    });

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    });

    btnStart.addEventListener('click', () => {
      startAbductionProcess();
    });

    window.addEventListener('resize', () => {
      resizeCanvas();
    });

    window.addEventListener('load', () => {
      initData();
    });
  </script>
</body>
