<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFO Gọi Học Sinh - Trò Chơi Điểm Danh Vui Nhộn</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter & Fredoka -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Fredoka', 'Inter', sans-serif;
            overflow: hidden;
            background: #090d16;
        }
        /* Hiệu ứng luồng sáng UFO hình thang */
        .ufo-beam {
            clip-path: polygon(40% 0%, 60% 0%, 100% 100%, 0% 100%);
            background: linear-gradient(to bottom, rgba(52, 211, 153, 0.6), rgba(16, 185, 129, 0.15));
            pointer-events: none;
            transition: all 0.5s ease-in-out;
        }
        @keyframes floatUfo {
            0%, 100% { transform: translateY(0px) translateX(0px); }
            50% { transform: translateY(-12px) translateX(8px); }
        }
        .animate-ufo {
            animation: floatUfo 4s ease-in-out infinite;
        }
        @keyframes pulseBeam {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .beam-pulse {
            animation: pulseBeam 1.5s ease-in-out infinite;
        }
        /* Hiệu ứng học sinh bay lên */
        @keyframes beamUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            80% { transform: translateY(-280px) scale(0.6); opacity: 0.9; }
            100% { transform: translateY(-350px) scale(0.2); opacity: 0; }
        }
        .student-beaming {
            animation: beamUp 1.5s ease-in forwards;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col justify-between select-none relative">

    <!-- KHU VỰC BẦU TRỜI & THÀNH PHỐ (CANVAS & HTML BACKGROUND) -->
    <div id="game-container" class="absolute inset-0 w-full h-full overflow-hidden flex flex-col justify-between bg-gradient-to-b from-[#050814] via-[#101935] to-[#1e293b]">
        
        <!-- Các ngôi sao lấp lánh nền -->
        <div class="absolute inset-0 opacity-40 pointer-events-none" id="stars-layer"></div>

        <!-- MẶT TRĂNG VÀ MÂY -->
        <div class="absolute top-8 left-12 w-20 h-20 bg-yellow-100 rounded-full shadow-[0_0_40px_rgba(254,240,138,0.6)] opacity-90"></div>
        <div class="absolute top-16 left-32 w-32 h-10 bg-blue-900/30 rounded-full blur-sm"></div>

        <!-- THANH ĐIỀU KHIỂN & TRẠNG THÁI TRÊN CÙNG -->
        <header class="relative z-20 flex flex-wrap justify-between items-center px-6 py-4 bg-slate-900/80 backdrop-blur-md border-b border-slate-700/50 shadow-lg">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-500 text-slate-950 font-bold px-3 py-1.5 rounded-xl shadow flex items-center space-x-2">
                    <i class="fa-solid fa-satellite text-lg animate-spin"></i>
                    <span id="header-status">UFO đang dò tín hiệu...</span>
                </div>
                <div class="bg-slate-800 text-emerald-400 font-bold px-4 py-1.5 rounded-xl border border-emerald-500/30 flex items-center space-x-2">
                    <i class="fa-solid fa-users"></i>
                    <span id="counter-display">0 / 3 học sinh</span>
                </div>
            </div>

            <div class="flex items-center space-x-3 mt-2 sm:mt-0">
                <button onclick="openSettings()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold px-4 py-2 rounded-xl transition shadow flex items-center space-x-2">
                    <i class="fa-solid fa-gear"></i>
                    <span>Danh sách HS</span>
                </button>
                <button onclick="resetGame()" class="bg-rose-600/80 hover:bg-rose-500 text-white font-semibold px-4 py-2 rounded-xl transition shadow flex items-center space-x-2">
                    <i class="fa-solid fa-rotate-right"></i>
                    <span>Chơi lại</span>
                </button>
            </div>
        </header>

        <!-- UFO VÀ LUỒNG SÁNG -->
        <div id="ufo-wrapper" class="absolute top-20 left-1/2 -translate-x-1/2 z-30 flex flex-col items-center pointer-events-none transition-all duration-1000 animate-ufo" style="width: 320px;">
            <!-- Đèn đĩa bay -->
            <div class="relative flex justify-center items-center w-72 h-20 bg-gradient-to-r from-slate-400 via-slate-200 to-slate-400 rounded-full shadow-[0_0_30px_rgba(52,211,153,0.8)] border-2 border-emerald-300">
                <!-- Vòm kính cockpit -->
                <div class="absolute -top-10 w-24 h-16 bg-gradient-to-b from-cyan-300/80 to-teal-500/50 rounded-t-full border-t border-cyan-200 flex justify-center items-center overflow-hidden">
                    <div class="w-3 h-3 bg-green-400 rounded-full animate-ping"></div>
                </div>
                <!-- Đèn nhấp nháy quanh thân UFO -->
                <div class="absolute bottom-1 w-full flex justify-around px-6">
                    <div class="w-2.5 h-2.5 bg-yellow-400 rounded-full animate-pulse"></div>
                    <div class="w-2.5 h-2.5 bg-rose-500 rounded-full animate-pulse delay-100"></div>
                    <div class="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-pulse delay-200"></div>
                    <div class="w-2.5 h-2.5 bg-yellow-400 rounded-full animate-pulse delay-300"></div>
                </div>
            </div>
            <!-- Luồng sáng chiếu xuống -->
            <div id="ufo-beam" class="ufo-beam w-80 h-96 beam-pulse mt-[-4px] opacity-75"></div>
        </div>

        <!-- KHU VỰC ĐƯỜNG PHỐ & HỌC SINH ĐỨNG (DƯỚI ĐẤT) -->
        <div class="relative z-10 w-full flex-grow flex items-end pb-12 px-6">
            <!-- Nền tòa nhà thành phố phía sau -->
            <div class="absolute bottom-24 inset-x-0 h-48 bg-gradient-to-t from-[#111827] to-transparent flex justify-around items-end opacity-60 pointer-events-none px-4">
                <div class="w-24 h-36 bg-slate-800 rounded-t-lg"></div>
                <div class="w-32 h-44 bg-slate-900 rounded-t-lg relative">
                    <div class="grid grid-cols-2 gap-2 p-2">
                        <div class="w-4 h-6 bg-yellow-300/40 rounded"></div>
                        <div class="w-4 h-6 bg-yellow-300/20 rounded"></div>
                    </div>
                </div>
                <div class="w-28 h-40 bg-slate-800 rounded-t-lg"></div>
                <div class="w-36 h-48 bg-slate-950 rounded-t-lg"></div>
            </div>

            <!-- Mặt đường thành phố -->
            <div class="absolute bottom-0 inset-x-0 h-28 bg-[#151c2f] border-t-4 border-slate-700/80 flex items-center px-8 shadow-inner">
                <!-- Đèn đường -->
                <div class="absolute bottom-24 left-16 w-3 h-28 bg-slate-600 rounded-t">
                    <div class="absolute -top-3 -left-4 w-10 h-4 bg-slate-500 rounded-full shadow-[0_10px_20px_rgba(253,224,71,0.6)]"></div>
                </div>
                <div class="absolute bottom-24 right-20 w-3 h-28 bg-slate-600 rounded-t">
                    <div class="absolute -top-3 -left-4 w-10 h-4 bg-slate-500 rounded-full shadow-[0_10px_20px_rgba(253,224,71,0.6)]"></div>
                </div>
            </div>

            <!-- Lưới chứa các học sinh trên đường (đứng cạnh xe máy) -->
            <div id="students-grid" class="relative z-20 w-full max-w-6xl mx-auto flex flex-wrap justify-center items-end gap-6 pb-6">
                <!-- Các nhân vật sẽ được render bằng JavaScript -->
            </div>
        </div>

        <!-- NÚT GỌI HỌC SINH (HÀNH ĐỘNG CHÍNH) -->
        <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-40">
            <button id="call-btn" onclick="callStudent()" class="bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-extrabold text-xl px-8 py-4 rounded-2xl shadow-[0_0_30px_rgba(16,185,129,0.6)] border-2 border-emerald-200 transform hover:scale-105 active:scale-95 transition flex items-center space-x-3">
                <i class="fa-solid fa-bolt text-2xl animate-bounce"></i>
                <span>Bắt Đầu Gọi Học Sinh!</span>
            </button>
        </div>
    </div>

    <!-- MODAL HIỆN THÔNG BÁO HỌC SINH ĐƯỢC CHỌN -->
    <div id="congrats-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-gradient-to-b from-slate-900 to-slate-800 border-2 border-emerald-500/60 rounded-3xl p-8 max-w-md w-full text-center shadow-[0_0_50px_rgba(16,185,129,0.4)] transform animate-scaleUp">
            <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl border border-emerald-500/40">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <p class="text-emerald-400 font-semibold tracking-wider text-sm uppercase mb-1">🎉 Tên Học Sinh Được Chọn 🎉</p>
            <h2 id="winner-name" class="text-4xl font-extrabold text-white my-3 drop-shadow-md">Cao Xuân Tiên</h2>
            <p class="text-slate-300 text-sm mb-6">UFO đã tóm gọn thành công học sinh này! Sẵn sàng câu hỏi tiếp theo nhé giáo viên ơi.</p>
            <button onclick="closeModal()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl shadow-lg transition text-lg">
                Tiếp Tục Gọi <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </div>
    </div>

    <!-- MODAL CÀI ĐẶT DANH SÁCH HỌC SINH -->
    <div id="settings-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-700 rounded-3xl p-6 max-w-lg w-full shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-white flex items-center space-x-2">
                    <i class="fa-solid fa-list-check text-emerald-400"></i>
                    <span>Tùy Chỉnh Danh Sách Học Sinh</span>
                </h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <p class="text-slate-400 text-sm mb-3">Nhập danh sách tên học sinh (mỗi tên một dòng hoặc cách nhau bằng dấu phẩy):</p>
            <textarea id="student-input" rows="7" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500 font-mono text-sm leading-relaxed"></textarea>
            
            <div class="mt-6 flex justify-end space-x-3">
                <button onclick="closeSettings()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-5 py-2.5 rounded-xl transition">
                    Hủy
                </button>
                <button onclick="saveStudentList()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl shadow transition">
                    Lưu & Cập Nhật
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPT XỬ LÝ TRÒ CHƠI -->
    <script>
        // Danh sách học sinh mặc định phong phú như hình mẫu
        let defaultStudents = [
            "Cao Xuân Tiên", "Đỗ Văn Khánh", "Hoàng Đức", "Đào Đức Thảo", 
            "Nguyễn Hoàng Anh", "Nguyễn Quang", "Đỗ Thế Khánh", "Cao Minh Quân", 
            "Đinh Tiến Đạt", "Nguyễn Văn Hùng", "Vũ Phạm Quỳnh", "Hoàng Thế Long"
        ];

        let students = [...defaultStudents];
        let calledStudents = [];
        let isCalling = false;

        // Khởi tạo các ngôi sao nền
        const starsLayer = document.getElementById('stars-layer');
        for (let i = 0; i < 40; i++) {
            const star = document.createElement('div');
            star.className = 'absolute bg-white rounded-full';
            const size = Math.random() * 3 + 1;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 70}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.opacity = Math.random();
            starsLayer.appendChild(star);
        }

        // Render học sinh ra màn hình đường phố
        function renderStudents() {
            const container = document.getElementById('students-grid');
            container.innerHTML = '';
            
            students.forEach((name, index) => {
                const isCalled = calledStudents.includes(name);
                
                const card = document.createElement('div');
                card.id = `student-card-${index}`;
                card.className = `relative flex flex-col items-center transition-all duration-500 ${isCalled ? 'opacity-30 scale-90 grayscale' : 'opacity-100 hover:scale-105'}`;
                
                card.innerHTML = `
                    <!-- Bong bóng tên học sinh -->
                    <div class="mb-2 bg-slate-900/90 text-white font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-xl shadow-lg border border-slate-700 whitespace-nowrap flex items-center space-x-1.5">
                        <span class="w-2 h-2 rounded-full ${isCalled ? 'bg-slate-500' : 'bg-emerald-400 animate-pulse'}"></span>
                        <span>${name}</span>
                    </div>
                    <!-- Nhân vật và xe máy SVG dễ thương -->
                    <div class="relative flex items-center justify-center">
                        <svg class="w-16 h-16 sm:w-20 sm:h-20 drop-shadow-lg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <!-- Xe máy scooter đơn giản -->
                            <path d="M25 75L40 75L55 85L75 85" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
                            <circle cx="35" cy="85" r="9" fill="#334155" stroke="#cbd5e1" stroke-width="3"/>
                            <circle cx="70" cy="85" r="9" fill="#334155" stroke="#cbd5e1" stroke-width="3"/>
                            <!-- Học sinh ngồi cạnh xe -->
                            <circle cx="50" cy="45" r="12" fill="#fbbf24"/>
                            <path d="M38 70C38 58 43 55 50 55C57 55 62 58 62 70" fill="#3b82f6"/>
                            <path d="M45 42L55 42" stroke="#1e293b" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </div>
                `;
                container.appendChild(card);
            });

            updateCounter();
            document.getElementById('student-input').value = students.join('\n');
        }

        function updateCounter() {
            document.getElementById('counter-displayinnerText') || (document.getElementById('counter-display').innerText = `${calledStudents.length} / ${students.length} học sinh`);
        }

        // Bắt đầu quy trình UFO gọi học sinh
        function callStudent() {
            if (isCalling) return;
            const remaining = students.filter(s => !calledStudents.includes(s));
            if (remaining.length === 0) {
                showModal("Đã gọi hết tất cả học sinh trong danh sách!");
                return;
            }

            isCalling = true;
            const callBtn = document.getElementById('call-btn');
            callBtn.disabled = true;
            callBtn.classList.add('opacity-50', 'cursor-not-allowed');

            const statusHeader = document.getElementById('header-status');
            statusHeader.innerText = "UFO đang quét tìm học sinh...";

            // UFO di chuyển ngẫu nhiên trên màn hình trước khi chọn
            const ufoWrapper = document.getElementById('ufo-wrapper');
            let steps = 0;
            const randomMoveInterval = setInterval(() => {
                steps++;
                const randomX = (Math.random() - 0.5) * 60; // Dịch chuyển qua lại
                ufoWrapper.style.transform = `translateX(calc(-50% + ${randomX}vw))`;
                if (steps > 6) {
                    clearInterval(randomMoveInterval);
                    ufoWrapper.style.transform = `translateX(-50%)`; // Trở về giữa
                    selectRandomStudent(remaining);
                }
            }, 300);
        }

        // Chọn ngẫu nhiên học sinh còn lại và kích hoạt hiệu ứng hút
        function selectRandomStudent(remainingList) {
            const chosenName = remainingList[Math.floor(Math.random() * remainingList.length)];
            const originalIndex = students.indexOf(chosenName);

            const statusHeader = document.getElementById('header-status');
            statusHeader.innerText = `Đã khóa mục tiêu: ${chosenName}!`;

            // Định vị UFO dịch đến vị trí gần học sinh (nếu muốn, hoặc chiếu thẳng xuống)
            const cardElement = document.getElementById(`student-card-${originalIndex}`);
            if (cardElement) {
                cardElement.classList.add('student-beaming');
            }

            // Sau hiệu ứng bay lên, hiển thị modal chúc mừng
            setTimeout(() => {
                calledStudents.push(chosenName);
                renderStudents();

                document.getElementById('winner-name').innerText = chosenName;
                document.getElementById('congrats-modal').classList.remove('hidden');

                const callBtn = document.getElementById('call-btn');
                callBtn.disabled = false;
                callBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                statusHeader.innerText = "UFO đang dò tín hiệu...";
                isCalling = false;
            }, 1500);
        }

        function closeModal() {
            document.getElementById('congrats-modal').classList.add('hidden');
        }

        function openSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        function saveStudentList() {
            const rawText = document.getElementById('student-input').value;
            const newNames = rawText
                .split(/[\n,]+/)
                .map(s => s.trim())
                .filter(s => s.length > 0);

            if (newNames.length === 0) {
                alert("Danh sách không được để trống!");
                return;
            }

            students = newNames;
            calledStudents = [];
            renderStudents();
            closeSettings();
        }

        function resetGame() {
            calledStudents = [];
            renderStudents();
            document.getElementById('header-status').innerText = "UFO đang dò tín hiệu...";
        }

        // Khởi chạy ban đầu
        window.onload = function() {
            renderStudents();
        };
    </script>
</body>
</html>
