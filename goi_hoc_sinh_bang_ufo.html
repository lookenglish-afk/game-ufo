<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gọi học sinh bằng UFO</title>
<style>
:root{--ink:#163b3b;--mint:#bcefe3;--mint2:#d8fff4;--cream:#fff8df;--pink:#f7dce7;--dark:#103c38}
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;background:#e8f4f1;color:var(--ink)}
button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font-weight:800;background:#174b43;color:white;box-shadow:0 3px 0 #0c302b;transition:.15s}button:hover{transform:translateY(-1px)}button:active{transform:translateY(2px);box-shadow:none}
.app{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;max-width:1500px;margin:auto;padding:14px;min-height:100vh}
.stage{position:relative;min-height:690px;overflow:hidden;border:5px solid #c9e4e2;border-radius:24px;background:linear-gradient(#5d8da4 0%,#82b6c3 42%,#c5e9e0 43%,#b5e6dc 100%);box-shadow:0 8px 22px #214b4b22}
.sky-specks{position:absolute;inset:0;background-image:radial-gradient(#e3fff8 1px,transparent 2px),radial-gradient(#d5f7f3 2px,transparent 3px);background-size:95px 80px,173px 137px;background-position:10px 5px,50px 20px;opacity:.65}
.buildings{position:absolute;bottom:25%;left:-2%;width:104%;height:34%;display:flex;align-items:end;gap:8px;opacity:.96}
.building{position:relative;flex:1;height:75%;background:#a7bfc5;border:2px solid #6e9ba7;box-shadow:inset 0 10px #c0d3d6}
.building:nth-child(2n){height:95%;background:#b5c7c9}.building:nth-child(3n){height:62%;background:#8fb0ba}
.windows{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:15px 9px}.windows i{display:block;height:28px;background:#fff0b6;border:2px solid #f4e9bd;box-shadow:0 0 9px #fff3b2}
.road{position:absolute;bottom:0;left:0;width:100%;height:28%;background:linear-gradient(#d8f0e8,#a7d9d1);border-top:7px solid #f9e9e7}
.road:after{content:"";position:absolute;top:55%;left:0;width:100%;border-top:3px dashed #f7fff7;opacity:.7}
.topbar{position:absolute;z-index:10;top:14px;left:50%;transform:translateX(-50%);width:min(76%,620px);background:#102f2d;border:3px solid #527b76;border-radius:12px;color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 5px 0 #143b38}
.topbar strong{font-size:clamp(12px,1.5vw,17px)}.pill{white-space:nowrap;border-radius:18px;padding:6px 12px;background:#fff9e6;color:#193e3a;font-weight:900;font-size:13px}
.ufo{position:absolute;z-index:5;top:12%;left:50%;transform:translateX(-50%);width:min(82%,790px);height:160px;filter:drop-shadow(0 8px 5px #275e5b22)}
.ufo-dome{position:absolute;left:33%;top:0;width:34%;height:70px;background:linear-gradient(120deg,#b6eaff,#d7f7ff 50%,#8ec8da);border:4px solid #d9f5f2;border-bottom:0;border-radius:90px 90px 15px 15px;opacity:.95}
.alien{position:absolute;top:22px;left:45%;width:18px;height:25px;border-radius:50%;background:#b5ed77;box-shadow:28px 0 #b5ed77}
.alien:before,.alien:after{content:"";position:absolute;top:-9px;width:4px;height:14px;background:#b5ed77;border-radius:4px;transform:rotate(-20deg)}.alien:after{left:29px;transform:rotate(20deg)}
.ufo-disc{position:absolute;top:38px;left:0;width:100%;height:100px;border-radius:50%;background:linear-gradient(#fffdf3 0 43%,#d9f9ef 45%,#a7e2d9 100%);border:4px solid #edf9ed;box-shadow:inset 0 -7px #8ecbc6}
.ufo-disc:after{content:"";position:absolute;left:39%;top:72px;width:22%;height:24px;border-radius:50%;background:#a9f3dc;border:3px solid #a1d8cb}
.light{position:absolute;top:98px;width:15px;height:15px;border-radius:50%;background:#ffe17b;box-shadow:0 0 12px #ffe17b}.light.l1{left:8%}.light.l2{right:8%;background:#70e4d8;box-shadow:0 0 12px #70e4d8}
.counter{position:absolute;z-index:8;top:31%;left:50%;transform:translateX(-50%);background:#123f39;color:white;border:3px solid #8dd5c8;border-radius:10px;padding:5px 22px;font-weight:1000;font-size:25px;box-shadow:0 4px 0 #1a5b51}
.beam{position:absolute;z-index:2;top:34%;left:50%;transform:translateX(-50%);width:95%;height:50%;background:linear-gradient(180deg,#c8fff0aa,#d6fff055 72%,transparent);clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);opacity:.9;pointer-events:none}
.lamp{position:absolute;z-index:4;bottom:19%;width:14px;height:190px;background:#143f3d;border-radius:8px 8px 3px 3px;box-shadow:0 0 0 2px #b5ddd4}.lamp:before{content:"";position:absolute;top:0;left:-12px;width:40px;height:12px;border-radius:8px;background:#183d3c;transform:rotate(-8deg)}.lamp:after{content:"";position:absolute;bottom:-8px;left:-9px;width:32px;height:9px;background:#143f3d;clip-path:polygon(25% 0,75% 0,100% 100%,0 100%)}
.lamp.one{left:25%}.lamp.two{right:23%;height:235px}
.students{position:absolute;z-index:6;left:0;right:0;bottom:4%;height:48%;display:flex;align-items:end;justify-content:space-around;gap:4px;padding:0 2%;pointer-events:none}
.student{position:relative;width:clamp(62px,10%,115px);height:150px;flex:0 1 115px;transition:transform .7s,opacity .7s;pointer-events:auto}
.student.captured{transform:translateY(-250px) scale(.3);opacity:0}
.name-tag{position:absolute;z-index:3;left:50%;top:-5px;transform:translateX(-50%);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:2px solid #fff8e5;border-radius:20px;padding:5px 10px;background:#fff9e9;color:#34504c;font-size:clamp(9px,1vw,13px);font-weight:900;box-shadow:0 2px 3px #426d6733}
.person{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);width:56px;height:75px}
.head{position:absolute;top:0;left:12px;width:34px;height:37px;border-radius:46% 46% 42% 42%;background:#e9b48a;border:2px solid #8a6652}
.hair{position:absolute;top:-4px;left:10px;width:38px;height:17px;border-radius:60% 50% 20% 20%;background:#49382f}
.eye{position:absolute;top:15px;left:9px;width:4px;height:5px;border-radius:50%;background:#273b39;box-shadow:12px 0 #273b39}
.body{position:absolute;top:32px;left:5px;width:48px;height:42px;border-radius:12px 12px 5px 5px;background:var(--shirt,#f39b76);border:2px solid #fff2d9}
.body:after{content:"";position:absolute;left:19px;top:0;height:100%;border-left:2px solid #ffffff70}
.legs{position:absolute;bottom:0;left:14px;width:10px;height:20px;background:#415d71;box-shadow:17px 0 #415d71}
.scooter{position:absolute;bottom:0;left:4px;width:62px;height:22px;border-bottom:5px solid #263e48}
.scooter:before,.scooter:after{content:"";position:absolute;bottom:-10px;width:13px;height:13px;border-radius:50%;background:#243b43;border:3px solid #819d9c}.scooter:before{left:0}.scooter:after{right:0}
.scooter i{position:absolute;left:36px;top:-18px;height:24px;border-left:4px solid #273f47;transform:rotate(-10deg)}.scooter b{position:absolute;left:31px;top:-21px;width:17px;border-top:4px solid #273f47;transform:rotate(-10deg)}
.student:nth-child(4n+1){--shirt:#ef9878}.student:nth-child(4n+2){--shirt:#7db5d3}.student:nth-child(4n+3){--shirt:#e5c16e}.student:nth-child(4n){--shirt:#a9c985}
.student:nth-child(2n) .person{transform:translateX(-50%) scale(.88)}.student:nth-child(3n) .person{bottom:24px;transform:translateX(-50%) scale(1.05)}
.side{background:#f9fff9;border:2px solid #c6e5dc;border-radius:22px;padding:18px;box-shadow:0 8px 22px #214b4b16;align-self:start;position:sticky;top:12px}
.side h2{margin:0 0 6px;font-size:22px}.sub{font-size:13px;line-height:1.45;color:#597671;margin:0 0 16px}
.field{display:block;font-weight:900;font-size:13px;margin:13px 0 6px}.side input,.side textarea{width:100%;border:2px solid #c8e5dc;border-radius:10px;padding:9px;background:#fffefa;color:#163b3b;outline:none}.side input:focus,.side textarea:focus{border-color:#3f9b87}.side textarea{resize:vertical;min-height:155px;line-height:1.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.actions button{font-size:12px;padding:10px 7px}.secondary{background:#d9eee7;color:#19453f;box-shadow:0 3px 0 #a7d0c4}.danger{background:#9c534e;box-shadow:0 3px 0 #743a37}.status{margin-top:12px;background:#edf8f3;border-radius:12px;padding:10px;font-size:13px;line-height:1.4;min-height:40px}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:#66827b}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#56b79c;margin-right:4px}
@media(max-width:900px){.app{grid-template-columns:1fr}.stage{min-height:650px}.side{position:static}.students{height:43%}.student{transform:scale(.9);transform-origin:bottom center}.ufo{top:13%}}
@media(max-width:500px){.app{padding:6px}.stage{min-height:590px;border-radius:14px}.topbar{width:90%;padding:8px}.ufo{width:90%;height:125px}.ufo-disc{height:80px}.counter{top:30%;font-size:20px}.students{bottom:5%;height:40%;padding:0}.student{width:52px;min-width:0;transform:scale(.78);transform-origin:bottom center;margin:0 -7px}.name-tag{font-size:9px;padding:4px 6px;max-width:105px}.person{transform:translateX(-50%) scale(.85)}.beam{top:34%;height:45%}}
</style>
</head>
<body>
<div class="app">
<section class="stage" aria-label="Sân chơi UFO gọi học sinh">
 <div class="sky-specks"></div>
 <div class="buildings" aria-hidden="true">
  <div class="building"><div class="windows"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="building"><div class="windows"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="building"><div class="windows"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="building"><div class="windows"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="building"><div class="windows"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
 </div>
 <div class="road"></div>
 <div class="topbar"><strong>✦ ĐỘT KÍCH! UFO ĐANG TÌM HỌC SINH...</strong><span class="pill" id="studentPill">12 học sinh</span></div>
 <div class="ufo"><div class="ufo-dome"></div><div class="alien"></div><div class="ufo-disc"></div><span class="light l1"></span><span class="light l2"></span></div>
 <div class="counter" id="counter">0/3</div><div class="beam" id="beam"></div>
 <div class="lamp one"></div><div class="lamp two"></div>
 <div class="students" id="students"></div>
</section>
<aside class="side">
 <h2>🛸 Điều khiển UFO</h2>
 <p class="sub">Tùy chỉnh danh sách, số học sinh bị bắt và bắt đầu trò chơi gọi tên ngẫu nhiên.</p>
 <div class="row">
  <div><label class="field" for="total">Số học sinh hiển thị</label><input id="total" type="number" min="1" max="30" value="12"></div>
  <div><label class="field" for="captureCount">Số bạn bị bắt</label><input id="captureCount" type="number" min="1" max="30" value="3"></div>
 </div>
 <label class="field" for="names">Tên học sinh (mỗi dòng một tên)</label>
 <textarea id="names" spellcheck="false">Cao Xuân Tiến
Nguyễn Quang
Nguyễn Hoài An
Đào Đức Thừa
Hoàng Thị Long
Đỗ Văn Khoanh
Cao Minh Quân
Nguyễn Văn
Võ Phạm
Đỗ Thế Khoanh
Nguyễn Hòa
Hoàng Đức</textarea>
 <div class="actions">
  <button class="secondary" id="apply">↻ Cập nhật danh sách</button>
  <button id="start">🛸 Bắt đầu bắt!</button>
  <button class="secondary" id="next">🎯 Bắt 1 bạn</button>
  <button class="danger" id="reset">⟲ Chơi lại</button>
 </div>
 <div class="status" id="status" role="status">Sẵn sàng! Nhấn “Bắt đầu bắt!” để UFO chọn học sinh ngẫu nhiên.</div>
 <div class="legend"><span><i class="dot"></i>Đang ở sân</span><span>✨ UFO sẽ gọi tên ngẫu nhiên</span></div>
</aside>
</div>
<script>
const $=id=>document.getElementById(id);
let roster=[], captured=[], busy=false;
const colors=['#ef9878','#7db5d3','#e5c16e','#a9c985','#b7a0d8','#6fc6b6'];
function readNames(){return $('names').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean)}
function render(){
 const host=$('students');host.innerHTML='';
 const count=Math.min(roster.length,30);
 roster.slice(0,count).forEach((name,i)=>{
  const gone=captured.includes(name);
  const el=document.createElement('div');el.className='student'+(gone?' captured':'');el.style.setProperty('--shirt',colors[i%colors.length]);
  el.innerHTML=`<div class="name-tag" title=""></div><div class="person"><div class="hair"></div><div class="head"><span class="eye"></span></div><div class="body"></div><div class="legs"></div></div><div class="scooter"><i></i><b></b></div>`;
  el.querySelector('.name-tag').textContent=name;
  el.querySelector('.name-tag').title=name;
  host.appendChild(el);
 });
 $('studentPill').textContent=roster.length+' học sinh';
 $('counter').textContent=captured.length+'/'+Math.min(Number($('captureCount').value)||1,roster.length);
}
function applyRoster(){
 const names=readNames();const n=Math.max(1,Math.min(30,Number($('total').value)||names.length||1));
 roster=names.slice(0,n);
 while(roster.length<n)roster.push('Học sinh '+(roster.length+1));
 captured=[];render();
 $('status').textContent=`Đã cập nhật ${roster.length} học sinh. Có thể bắt đầu!`;
}
function pickOne(){
 if(busy)return;
 const target=Math.min(Math.max(1,Number($('captureCount').value)||1),roster.length);
 const available=roster.filter(n=>!captured.includes(n));
 if(!available.length||captured.length>=target){$('status').textContent='🎉 Hoàn thành! UFO đã bắt đủ số học sinh mục tiêu.';return}
 const name=available[Math.floor(Math.random()*available.length)];
 captured.push(name);render();
 $('status').textContent='🛸 UFO đã chọn: '+name+'!';
 if(captured.length>=target)$('status').textContent+=' Đã đủ '+target+' bạn rồi!';
}
function startGame(){
 if(busy)return;
 const target=Math.min(Math.max(1,Number($('captureCount').value)||1),roster.length);
 if(!roster.length){$('status').textContent='Hãy nhập danh sách học sinh trước nhé.';return}
 if(captured.length>=target)captured=[];
 busy=true;$('start').textContent='🛸 UFO đang bay...';$('beam').style.opacity='1';
 let steps=0;const timer=setInterval(()=>{
  if(steps>=target||captured.length>=target){clearInterval(timer);busy=false;$('start').textContent='🛸 Bắt đầu bắt!';$('beam').style.opacity='.9';$('status').textContent='🎉 Hoàn thành! Học sinh được gọi: '+captured.join(', ');return}
  pickOne();steps++;
 },850);
}
$('apply').addEventListener('click',applyRoster);
$('start').addEventListener('click',startGame);
$('next').addEventListener('click',pickOne);
$('reset').addEventListener('click',()=>{captured=[];render();$('status').textContent='Đã chơi lại. Tất cả học sinh đã trở về sân!'});
$('captureCount').addEventListener('change',()=>{render();});
$('total').addEventListener('change',()=>{const names=readNames();if(Number($('total').value)<1)$('total').value=1;if(Number($('total').value)>30)$('total').value=30;});
applyRoster();
</script>
</body>
</html>
